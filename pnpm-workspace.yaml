allowBuilds:
  "@google/genai": false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
minimumReleaseAgeExclude:
  - typebox@1.3.18
  - "@agntn/*"

catalogs:
  deps:
    "@agntn/tools": 0.2.1
    "@modelcontextprotocol/server": 2.2.0
    node-html-parser: 9.0.4
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": 1.0.2
    "@modelcontextprotocol/client": 2.2.0
    "@oh-my-pi/pi-coding-agent": 18.0.0
    "@types/node": 26.2.0
    ai: 7.0.127
    obuild: 0.4.43
    typescript: 7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.6.0
    vite-plus: 1.6.0

cleanupUnusedCatalogs: true

# Keeps pnpm 12's env document out of the lockfile. GitHub reads that one as zero dependencies.
pmOnFail: ignore

overrides:
  vite@*: catalog:dev

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
